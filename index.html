<div class="bd"><span>INTERVIEW: STAR-L</span><span>ROLE PLAY: DISCOVERY</span><button id="th">Toggle theme</button><button id="cv">Cover mode: off</button></div>

<script>
const $=s=>document.querySelector(s);
const f=t=>t.replace(/\[\[(.+?)\]\]/g,'<mark class="f">$1</mark>');
const KEYS={S:'Situation',T:'Task',A:'Action',R:'Result',L:'Learning'};
const row=o=>Object.keys(KEYS).filter(k=>o[k]).map(k=>`<div class="row ${k}"><span class="k">${k}</span><div><b>${KEYS[k]}:</b> <span class="ans">${f(o[k])}</span></div></div>`).join('');

const STORIES=[
{n:'P&G: automated the reporting, then sold it',t:'Ownership · influence · results',
 S:'P&G Supply Network Operations. Disposal cost reporting was manual, slow and error-prone.',
 T:'I owned fixing it and getting senior leadership to adopt it, [[no one asked me to; say who set the goal]].',
 A:'I rebuilt the process in Power BI and Power Automate, end to end. [[Name 1 failed attempt you fixed]]. Then I presented it to senior leadership in terms of disposal cost, not tooling.',
 R:'Reporting time down 80%. It fed a project that delivered a 27% disposal cost reduction, and I was the first intern to have a project folded into the next fiscal year strategy.',
 L:'[[One line, true to you. Draft: a fix only lands when it is framed around the decision-maker\'s number, so I now open with their metric.]]'},
{n:'Rahatak: CFO in the INJAZ National Competition',t:'Pressure · pitching · numbers',
 S:'INJAZ National Competition. As CFO of Rahatak, we built autonomous airport wheelchairs, an accessibility solution, and had to pitch it to the CFO of Visa, the CEO of TotalEnergies and partners from EY.',

 R:'[[Placement, judge feedback, or a concrete reaction from one of the leaders.]]',
 L:'Facts convince, but people act on what they feel, so I now decide before every pitch what each listener personally cares about. [[Adjust to your own words.]]'},
{n:'Noon Minutes: dark store operations project',t:'Problem-solving · real client · tradeoffs',
 S:'Senior design project with Noon Minutes on dark store operations optimization, Aug 2025 to Apr 2026.',

 R:'[[Metric: pick time, throughput, cost, or adoption.]]',
 L:'[[What real operations taught you that a classroom model did not.]]'},
{n:'Ghana: logistics owner in Tamale',t:'Ownership · logistics · reliability',
 S:'International volunteer trip with Sharjah Charity International to Tamale, Ghana, Dec 2024, where I was a volunteer leader.',
 T:'We volunteered to renovate schools and rebuild critical infrastructure in the poorest town. I owned all logistics and had to make sure every material arrived on time.',

 R:'[[What was renovated or rebuilt, and how many students or residents it served. Even one number helps.]]',
 L:'[[Draft: on-site work only moves as fast as the slowest missing material, so I now plan backwards from the work date and confirm each delivery early.]]'},
{n:'SAP CRO: learning fast and building with AI',t:'Learning agility · judgment with AI',
 S:'Global Sales Strategy for Business Transformation Management intern in SAP\'s Chief Revenue Office, since May 2026. Unfamiliar domain.',
 T:'[[The task you were given and by when.]]',

 R:'[[Time saved, decision enabled, or who now uses it.]]',
 L:'AI drafts fast, I own the checking. [[Add your own rule.]]'},
{n:'P&G: winning over category leaders who said no',t:'Influence · disagreement · things not going to plan',
 S:'At P&G I had built an automated reporting solution, but the different category leaders initially rejected it. They wanted the work kept manual to cover their own needs.',
 T:'Without any authority over them, I had to get each leader to trust the solution, or it would never scale.',
 A:'Each leader came from a different background with different needs, so I did not pitch one version. [[Name what you did: 1-to-1 conversations, asking what manual work protected, adding their requirement into the automation.]] Then I took the combined solution to senior leadership.',
 R:'The leaders came around and the solution cut reporting time 80% and fed the 27% disposal cost reduction. [[Add how many leaders you won over.]]',
 L:'A rejection is usually an unmet need in disguise, so I now ask what a stakeholder is protecting before I defend my solution.'}
];


const SOL=[
{tag:'Solution 1',n:'Cisco AI Infrastructure',one:'Cisco page: "Securely scale AI." Networking, security, observability and AI-native tools.',
 plain:`AI programs need huge computing power and very fast, safe connections between the computers doing the work. Cisco does not make the AI apps. It makes the roads and security gates the data travels on, so AI runs quickly and safely.`,
 get:['Very fast networking inside data centers, where AI runs','Security that protects AI models and AI agents from misuse','Tools that watch everything and spot problems early','Ready-made designs built with Nvidia, so customers do not have to work it out themselves'],
 sam:`Sam would never buy this. It is for giant customers such as cloud companies. It still matters on the call because it shows Cisco is the company that makes AI run reliably and safely, and the same idea applies at Sam's size: AI is only as good as the connection and security underneath. Do not mention data centers to Sam.`,
 p:'Companies want to run AI but the network, security and operations underneath it are not built for the load, and AI agents can exploit gaps.',
 w:'AI spending is real: Cisco took $9.3B of hyperscaler AI orders in FY26 and expects AI traffic on networks to triple in three years.',
 d:'One stack covering networking, security and observability, instead of buying and stitching them together separately.',
 c:'CIOs, CTOs, data center owners, and the CFO who signs off the AI budget.',
 k:'AI Networking, Secure AI Factory, Silicon One, Cisco Cloud Control and AI Canvas (AgenticOps), AI Defense, Splunk Observability, Cisco IQ.',
 l:'AI only pays back if the network under it does not become the bottleneck or the breach, and Cisco is one of the few vendors selling all three layers together.'},
{tag:'Solution 2',n:'Cisco Secure Networking',one:'Cisco page: "Defense starts with the network." Build security into the network to stop and contain threats faster.',
 plain:`Instead of bolting a separate security product onto a network, Cisco builds protection into the network itself, so every device and connection is checked and threats are contained fast. Picture a building where every door has a lock and a guard, not just the front gate.`,
 get:['Firewalls: a security guard for the network','Identity checks so only the right people and devices get in (Cisco Duo asks for a second proof, like a phone prompt)','Web protection that blocks dangerous sites (Cisco Umbrella)','One place to set security rules for every site','Security updates applied without shutting things down'],
 sam:`Sam takes card payments and holds customer data across 12 shops with only an outside contractor. This is the answer to "who is protecting that, and what happens if something goes wrong?" Practically: guest Wi-Fi kept separate from the payment network, a second check on staff logins, and risky websites blocked at every shop.`,
 p:'Attackers move faster than people can respond, and devices and software agents now outnumber humans on networks.',
 w:'Cisco says quantum threats already put stolen data at risk, and it committed to quantum-safe capabilities across most of its core portfolio by December 2026.',
 d:'Security lives inside the network itself and is managed with one policy through Cisco Cloud Control. Live Protect patches at runtime with no reboot.',
 c:'CISOs and security teams, network leaders, and boards worried about breach cost and downtime.',
 k:'Live Protect, zero-trust identity for devices and agents, post-quantum encryption, Hybrid Mesh Firewall, Splunk Enterprise Security, Duo, Umbrella.',
 l:'A breach costs far more than prevention, and putting security into the network means it works at the speed attackers do.'},
{tag:'Solution 3',n:'Cisco Future-Proofed Workplaces',one:'Cisco page: "Modernize how business happens, everywhere it happens."',
 plain:`Everything that makes a physical place run smoothly: Wi-Fi, the network, security, cameras and sensors, and team calls and meetings, all managed together from one screen. "Workplace" includes shops and branches, not just offices.`,
 get:['Wi-Fi and network equipment managed remotely from the cloud (Cisco Meraki)','Secure links joining all sites into one network (SD-WAN)','Smart cameras and sensors, for example counting how busy a shop is','Team calling, messaging and video meetings (Webex)'],
 sam:`The closest fit to Sam's day to day: 12 shops each set up differently and a contractor who only comes when something breaks. One dashboard shows every shop, a new shop can be plugged in without a specialist visit, and many problems can be spotted and fixed remotely. This is the most relevant of the three.`,
 p:'IT, HR and facilities misaligned, inconsistent experiences across sites, more threats at distributed locations, and rising demand from AI and connected devices.',
 w:'Hybrid work is permanent, connected devices keep growing, and Cisco reported its best collaboration quarter in seven years in Q4 FY26.',
 d:'Only Cisco unifies networking, security, observability and collaboration with AI built in, on one platform that builds value over time.',
 c:'COOs, IT and facilities heads, and multi-site owners in retail, hospitality and offices who want a better experience at lower cost.',
 k:'Wi-Fi and switching, Catalyst SD-WAN, SASE, Zero Trust Access, smart buildings, Webex devices and AI, user protection.',
 l:'Every site, from head office to branch, gets the same secure, simple experience, and savings show up in energy, space and IT time.'}
];

const TM=[
['STAGE 1 · MACRO','Who I am and the pattern','I\'m Khaled, an industrial engineering graduate from the American University of Sharjah, based in Dubai. Across my projects, what pulled me in was never the model itself. It was the commercial problem, and then standing up to present the fix.'],
['STAGE 2 · FOCUSED','Proof I can sell a solution','At P&G, I built an automated reporting solution in Power BI and Power Automate, and had to sell it to category leaders who first rejected it. It cut reporting time [[80%]], fed a [[27%]] disposal cost reduction, and I was the first intern to have a project folded into the next fiscal year strategy. At Rahatak, I pitched our autonomous airport wheelchairs to the CFO of Visa, the CEO of TotalEnergies and partners from EY, using finance for the CFO and personal stories for the rest.'],
['STAGE 2 · FOCUSED','What I do now','Since May, I have been in SAP\'s Chief Revenue Office. I see go-to-market strategy from the top, and I have been building multi-agent AI workflows with Claude Code. What I keep noticing is that I want to own the customer conversation, not just the plan.'],
['STAGE 3 · CONNECTION','Why Cisco, why CSAP, why now','Cisco took [[$9.3B]] of hyperscaler AI orders last year and is a preferred technology partner in Stargate UAE, because AI runs on networking and security. CSAP is where I learn that portfolio and get a real number to carry, and I want to bring that back to this region.']
];
const tmayHTML=()=>TM.map(b=>`<div class="c"><div class="m">${b[0]} · ${b[1]}</div><p class="ans" style="margin-top:6px">${f(b[2])}</p></div>`).join('')+`<div class="w2 ok"><b>Delivery:</b> about 2 minutes. Slow down on the numbers and land the last sentence on Cisco by name. On video, look at the lens for Stage 3.</div>`;
const PH=[
[0,'Open','2 min','Set the frame, ask permission, promise no pitch.',`"Thanks for making time, Sam. I know you're busy and probably get plenty of vendor calls. I won't pitch anything today. I'd like to learn how Rivera Coffee runs and what's getting in the way, and then we can decide together if another chat is worth your time. Does that sound fair?"`],
[120,'Their story','3 min','Get Sam talking about the growth. Pride first, problems second.',`"How did you get from 3 shops to 12 in three years?" then "What got harder along the way?"`],
[300,'Dig','8 min','Find the real problem underneath, and what it costs. Follow Sam, not your list.',`"Tell me more about that." "Why does that matter?" "What is that costing you?" "What have you tried?"`],
[780,'The AI angle','4 min','Explore what Sam has heard, where it could help, and where it is noise. Do not pitch.',`"You mentioned AI. What have you been hearing, and what made you curious?"`],
[1020,'Play it back','2 min','Summarise in Sam\'s words and check you got it right.',`"Here's what I heard: growth outran the back office, you are the bottleneck on decisions, and you want to know where AI is real. Did I miss anything?"`],
[1140,'Earn the second meeting','1 min','Ask for a small, specific next step tied to what Sam said.',`"Would 30 minutes next week work? I'll bring a short view on [their top issue], and a colleague from our technical team if it helps. Which day suits you?"`]
];
const RQ=[
['Growth and the back office',[
 ['How did you get from 3 shops to 12 in three years?','What got harder as you grew?','What did that cost you in time or money?'],
 ['How do the shops run behind the counter day to day? Ordering, payments, scheduling, Wi-Fi?','Who fixes things when they break?','What happens at a busy campus shop at 8am if the systems go down?'],
 ['Which decisions still come to you that you wish did not?','What would you do with that time instead?']]],
['Customer experience',[
 ['What do your regulars love most about the shops?','What would put that at risk as you grow?'],
 ['How do peak times feel, especially near the campuses?','What do customers complain about, and how do you find out?'],

 ['How do you feel about customer and payment data across 12 locations?','Who looks after it today?'],

['The future',[

 ['If we spoke in six months and this had gone well, what would be different?']]],
['AI (the heart of the scenario)',[

 ['Where do you feel stuck or overwhelmed when it comes to AI?','What have you tried, if anything?'],
 ['If AI worked perfectly, what is the first problem you would want it to fix?','How would you know it was worth the money?']]]
];
const HYPE=[
['Where it could help (explore, do not assert)','Predicting busy periods for staffing and stock, cutting admin and reporting time, faster answers to customer questions, and spotting problems across shops earlier.'],
['Where it is mostly noise for a business this size','Big custom AI platforms, replacing the human warmth Sam is proud of, and "AI everything" before the basics like a reliable network and clean data are in place.'],
['The honest line to say','"AI only helps if it solves a real problem. Let\'s find the problem first, and then see whether AI is even the right tool."']

const CSOL=[
['Network reliability','A patchwork of systems and an outside IT contractor point to a fragile, hard-to-see network. Ask about downtime, not products.'],
['Security','Payment and customer data across 12 sites. Ask who is responsible and what happens after a breach.'],
['Guest and customer experience','Guest Wi-Fi, mobile ordering and peak-time lines, especially near campuses.'],
['Collaboration','Keeping shop managers and Sam connected as the chain grows toward 20.']

const OBJ=[
[`"I get vendor calls all the time."`,`"Fair enough. I'm not here to pitch. If this isn't useful after 20 minutes, we stop."`],
[`"I'm really busy."`,`"Understood, and that is exactly what I would like to hear more about. What is taking most of your time?"`],
[`"AI sounds like hype."`,`"A lot of it is, honestly. What would make something worth your time?"`],
[`"Just send me a brochure. What does it cost?"`,`"Happy to. The right answer depends on what you actually need, so can I ask two questions first?"`],
[`"I already have an IT guy."`,`"How is that working out? What happens when something breaks at a busy time?"`],
[`You do not know the answer`,`"I don't know that yet. Let me find out and bring it to our next conversation."`]

const STRUG=[
['Systems that do not talk to each other',`Each shop was opened as its own project. One till system here, a different scheduling tool there, spreadsheets in between. To see how the whole chain did last week, someone adds numbers up by hand.`,`Sam cannot see all 12 shops at once, finds out about problems late, and every new shop adds more mess.`,`"If you wanted to know how all 12 shops did last week, how would you find out?"`],
['Things breaking at the worst moment',`The Wi-Fi, card machines or ordering system go down at 8am near a campus. Sam relies on an outside contractor who visits when something breaks, so the fix can take hours or days.`,`Lost sales at the busiest time, frustrated regulars, and Sam gets pulled out of the business to firefight.`,`"What happens at a shop when the internet or the tills go down on a busy morning?"`],
['Staffing and scheduling',`Coffee shops usually have lots of staff turnover, many part-timers and students whose availability changes each semester. Building 12 rotas and covering sudden gaps takes a lot of time.`,`Managers lose hours on admin, shops run short or overstaffed, and training new people never stops.`,`"How do you build the schedules today, and who covers when someone calls in sick?"`],
['Keeping every shop the same',`Customers love the warm experience, but 12 shops mean 12 managers. Drink quality, service speed, even the Wi-Fi login can differ from shop to shop.`,`The brand promise is at risk, and growing to 20 shops means copying that experience 8 more times.`,`"How do you make sure a customer gets the same experience in shop 3 as in shop 12?"`],
['Stock, waste and guessing demand',`Milk, pastries and other fresh items spoil fast. Demand near campuses swings with term time, exams and holidays. Ordering is often by gut feel.`,`Money thrown away on waste, or shelves empty when a rush hits.`,`"How do you decide how much to order for each shop?"`],
['Queues at peak times',`Morning and between-lecture rushes create long lines. Mobile ordering and fast payments help only if the connection is reliable.`,`Customers walk away, and a poor peak-hour experience is what people remember.`,`"What do the busiest 30 minutes look like at your campus shops?"`],
['Protecting customer and card data',`Card payments at 12 sites, guest Wi-Fi, staff logging in from shared devices, and nobody whose full-time job is security.`,`One breach could mean fines, lost trust, and a very bad week for a brand built on trust.`,`"Who looks after the security of payments and customer data across all the shops?"`],
['Sam is the bottleneck',`Sam makes most big decisions personally and has a small team. Every system problem, hire and purchase lands on one desk.`,`No time to think about the next 8 shops. This is the stretched-thin feeling you picked up from the brief.`,`"Which decisions do you wish you could hand off, and what would you do with that time?"`]
];
const AIB=[
['Writing and marketing help','Real now, the most common starting point',`Drafting emails, social posts, promotions and menu descriptions. Many owners start here because it is cheap and easy.`,`Campus promotions, announcing a new shop, replying to reviews.`,
 ['Indirect, but real',`Marketing AI needs two things: something to say and someone to say it to. Wi-Fi turns visitors into data and contacts, and Cisco security keeps that data safe.`,`Meraki guest Wi-Fi shows a branded login page. With customer consent, it can ask for an email, which builds a promo list. Wi-Fi analytics show visit patterns and repeat visitors, so offers go out at the right times. Duo protects the logins to the marketing and loyalty tools.`,`"Do you have a way today to know who your repeat customers are and when they come in?"`]],
['Answering customer questions','Real now, but keep a human option',`Chatbots and AI phone answering for common questions. Some restaurants use AI to take reservation calls. Surveys show owners want a person available as a back-up.`,`Opening hours, order status, loyalty questions. Less useful for a coffee shop than for a restaurant with bookings.`,
 ['Light fit',`Chatbots and mobile ordering only work if the shop connection does.`,`Meraki keeps every shop reliably online. Webex also has customer contact and AI assistant tools, but they are built for larger call volumes, so mention them only if Sam has heavy phone or enquiry traffic.`,`"Where do customer questions come in today, and who answers them?"`]],
['Staff scheduling','Real now in restaurants',`Tools that build shift schedules from availability and expected demand.`,`Student staff with changing timetables across 12 shops.`,
 ['Indirect',`Rota apps run on tablets and phones in the shop, so they need steady Wi-Fi.`,`Reliable Wi-Fi (Meraki) so clock-in and rota apps never stall. Camera or Wi-Fi traffic data can show the real busy periods to staff against. Webex messaging can handle shift cover requests.`,`"When someone cancels last minute, how does the shop find cover?"`]],

const T={
'Plan':()=>`<h2>Game plan</h2><p class="lead">Source: Cisco's Interview candidate instructions. Every answer uses STAR-L. Learning is the fifth beat, and it is scored.</p>
<div class="c"><h3>Time split for a ~2 minute answer</h3><div class="bar"><b class="S" style="width:15%">S</b><b class="T" style="width:10%">T</b><b class="A" style="width:40%">A</b><b class="R" style="width:20%">R</b><b class="L" style="width:15%">L</b></div>
<small>Action is the largest slice. Say "I did", never "we did". Roughly 5 to 7 questions fit in 30 minutes, so aim for 2 minutes each and stop.</small>
${Object.keys(KEYS).map(k=>`<div class="row ${k}"><span class="k">${k}</span><div><b>${KEYS[k]}</b> ${{S:'Context from work, volunteering or academics. 2 sentences.',T:'Your specific responsibility, deadline or conflict.',A:'Exact steps YOU took. The core of the answer.',R:'Measurable outcome from your actions.',L:'Takeaway plus how you do it better next time.'}[k]}</div></div>`).join('')}</div>
<div class="g"><div class="c"><h3>What they score</h3><ul><li><b>Clarity and Ownership:</b> your contribution, your accountability.</li><li><b>Problem-Solving:</b> navigate a challenge, drive an outcome.</li><li><b>Continuous Improvement:</b> the Learning beat.</li></ul></div>
<div class="c"><h3>The room</h3><ul><li>Account Managers from Sales Enablement, Field Sales and Global Velocity Sales. Velocity is Cisco's high-velocity inside sales motion, where CSAP alumni land.</li><li>Recruiters may stay in the room between activities. Be consistent all day.</li></ul></div></div>
<div class="c"><h3>Practice tools</h3><p><button class="p" id="tm">Start 2:00 answer timer</button> <b id="tv" class="m" style="font-size:16px"></b></p><p><small>Cover mode blurs answers so you rehearse from the STAR-L letters. Tap a blurred line to peek.</small></p>
<p><small>AI mock prompt (from Cisco's own suggestion):</small></p><p class="ans"><small id="pr">Act as a Cisco assessor from Field Sales interviewing me for the Associate Sales Representative role. Ask one behavioral question at a time, wait for my answer, then check that I hit Situation, Task, Action, Result and Learning, that I said "I" not "we", and that Learning is specific. Tell me what to cut.</small></p><button class="p" id="cp">Copy prompt</button></div>`,
'About me':()=>`<h2>Tell me about yourself</h2><p class="lead">Funnel method: broad, then focused, then specific to Cisco. About 2 minutes.</p>${tmayHTML()}`,
'Stories':()=>`<h2>Story bank</h2><p class="lead">Six stories cover almost any question. Yellow blocks are gaps only you can fill. Fill them, then say each aloud in 2 minutes.</p>`+STORIES.map((s,i)=>`<details ${i?'':'open'}><summary><span><span class="tag">${s.t}</span><br>${s.n}</span></summary><div class="in">${row(s)}</div></details>`).join(''),
'Questions':()=>`<h2>Question bank</h2><p class="lead">${Q.length+1} likely questions. The answer sits directly under each question.</p><details><summary><span><span class="tag">Opener</span>Tell me about yourself.</span></summary><div class="in">${tmayHTML()}</div></details>`+Q.map(q=>`<details><summary><span><span class="tag">${q[0]}</span>${q[1]}</span></summary><div class="in">${q[2]!==null?`<div class="m">Your answer: ${STORIES[q[2]].n}</div>${row(STORIES[q[2]])}<p><b>Angle:</b> <span class="ans">${f(q[4])}</span></p>`:`<p><b>Answer:</b> <span class="ans">${f(q[4])}</span></p>`}<p><b>Testing:</b> ${q[3]}</p><div class="w2"><b>Avoid:</b> ${q[5]}</div></div></details>`).join(''),
'Role play':()=>`<h2>Role play: discovery call with Sam</h2><p class="lead">20 minutes live call, then 10 minutes assessor feedback. You are an Associate Sales Rep. Sam runs Rivera Coffee Co., 12 shops. Come with questions and a plan, not a script.</p>
<div class="c"><h3>Your one goal</h3><p><b>Earn the second meeting.</b> No pitch, no demo. Understand Sam's business, what is in the way, and what it costs. Sam should leave feeling understood.</p>
<p style="margin-top:10px"><button class="p" id="rtm">Start 20 min call timer</button> <b id="rtv" class="m" style="font-size:15px"></b></p></div>
<div class="c"><h3>Live cheat-sheet</h3>
${PH.map(p=>`<div class="row A" style="--x:var(--ac)"><span class="k" style="width:auto;padding:0 6px">${Math.floor(p[0]/60)}m</span><div><b>${p[1]}</b> <small>(${p[2]})</small><br><small>${p[3]}</small></div></div>`).join('')}
<div class="w2 ok"><b>Five follow-ups that always work:</b> "Tell me more about that." "Why does that matter?" "What is that costing you?" "What have you tried?" "What would good look like?"</div>
<div class="w2"><b>Talk ratio:</b> aim for Sam talking about 70% of the time. Ask the question underneath the first answer.</div></div>
<h3 style="margin:18px 0 4px">Sam and Rivera Coffee Co.</h3>
<div class="g"><div class="c"><h3>The business</h3><ul><li>Grew from 3 to 12 shops in about 3 years, aiming for 20 in 2 more.</li><li>Known for quality drinks, warm service, loyal regulars. Two busiest shops are near college campuses.</li><li>Each shop opened as its own project, so systems were added one at a time: a patchwork behind the counter.</li></ul></div>
<div class="c"><h3>Sam the person</h3><ul><li>Proud, protective of the customer experience, stretched thin.</li><li>Makes most big decisions personally. Small team plus an outside IT contractor who visits when things break.</li><li>A business owner, not a technologist. No jargon. Skeptical of "another vendor". Curious but overwhelmed by AI.</li></ul></div></div>
<h3 style="margin:18px 0 4px">What Sam may already be struggling with</h3>
<p class="lead">This is what a growing 12-shop coffee chain typically wrestles with day to day. Treat these as guesses to test with questions. Never say "I bet your Wi-Fi goes down", ask what happens when it does.</p>
<div class="c"><h3>The three to listen for first</h3><ul><li><b>Visibility:</b> Sam cannot see all 12 shops at once.</li><li><b>Downtime:</b> things break at peak times and wait for a contractor.</li><li><b>Sam's time:</b> everything lands on one desk.</li></ul></div>
${STRUG.map((s,i)=>`<details ${i?'':'open'}><summary><span><span class="tag">${i+1}</span>${s[0]}</span></summary><div class="in"><div class="row S"><span class="k">1</span><div><b>What it looks like:</b> ${s[1]}</div></div><div class="row A" style="--x:var(--rd)"><span class="k">2</span><div><b>What it costs Sam:</b> ${s[2]}</div></div><div class="row R"><span class="k">3</span><div><b>Ask:</b> <span class="ans">${s[3]}</span></div></div></div></details>`).join('')}
<h3 style="margin:18px 0 4px">Opening and question bank</h3><p class="lead">Open questions only (what, how, why). Each block has the first question and the layers underneath.</p>
<details open><summary><span><span class="tag">Open</span>Your first 2 minutes</span></summary><div class="in"><p class="ans">${PH[0][4]}</p></div></details>
${RQ.map(g=>`<details><summary><span>${g[0]}</span></summary><div class="in">${g[1].map(c=>`<div class="c" style="margin:8px 0"><div class="row S"><span class="k">1</span><div>${c[0]}</div></div>${c.slice(1).map((x,i)=>`<div class="row T"><span class="k">${i+2}</span><div>${x}</div></div>`).join('')}</div>`).join('')}</div></details>`).join('')}
<h3 style="margin:18px 0 4px">Where AI shows up for small businesses right now</h3>
<p class="lead">Use this to separate real from noise with Sam. Figures come from 2026 owner surveys, so quote them loosely, for example "around two thirds".</p>
<div class="g"><div class="c"><h3>Roughly 2 in 3</h3><small>US small businesses now use some form of AI. One mid-2026 survey put it at 66%, up from 55% a year earlier.</small></div>
<div class="c"><h3>7 in 10 want training</h3><small>Most owners say they need more training to use it well. Another survey found the learning curve is a top barrier. Sam feeling overwhelmed is normal, not behind.</small></div>
<div class="c"><h3>Owners stay selective</h3><small>They use AI for writing, admin and customer questions, and still want a person involved for anything high-stakes.</small></div></div>
<div class="c" style="border-left:4px solid var(--ac)"><h3>Where Cisco fits in Sam's AI story</h3><p>Cisco does not sell the marketing, scheduling or reporting AI. It makes them work better and more safely in three ways:</p><ul><li><b>Connect:</b> every shop reliably online and linked together, so data can flow to one place.</li><li><b>Protect:</b> customer data, payments and staff logins, including the logins to AI tools.</li><li><b>Provide data:</b> Wi-Fi and camera insight into who visits and when, which marketing and forecasting can use.</li></ul></div>
<details open><summary><span><span class="tag">Deep dive</span>Marketing in a small business, and where Cisco fits</span></summary><div class="in">${MKT.map((m,i)=>`<div class="row ${i==3||i==4?'T':'S'}"><span class="k">${i+1}</span><div><b>${m[0]}:</b> <span class="ans">${m[1]}</span></div></div>`).join('')}</div></details>
<p class="lead" style="margin-top:12px">Each use case below shows what it means for Sam and where Cisco fits, if at all:</p>
${AIB.map((a,i)=>`<details ${i?'':'open'}><summary><span><span class="tag">${a[1].split(',')[0]}</span>${a[0]}</span></summary><div class="in"><p><b>Status:</b> ${a[1]}</p><p><b>What it is:</b> ${a[2]}</p><div class="w2 ok" style="border-color:var(--A)"><b>For Sam:</b> ${a[3]}</div>
<div class="c" style="border-left:4px solid var(--ac)"><div class="m">Where Cisco fits: ${a[4][0]}</div><p><b>Why:</b> ${a[4][1]}</p><p><b>How:</b> ${a[4][2]}</p><p><b>Ask:</b> <span class="ans">${a[4][3]}</span></p></div></div></details>`).join('')}
<div class="c"><h3>The honest line to say</h3><p class="ans">"AI only helps if it solves a real problem. Let's find the problem first, and then see whether AI is even the right tool."</p></div>
<div class="c"><h3>AI questions to ask Sam</h3><ul><li>"Has anyone on your team tried any AI tools yet, even just for writing?"</li><li>"Where would an extra pair of hands help the most?"</li><li>"Is there anything you would not want AI anywhere near?" (This opens customer data and trust.)</li></ul></div>
<p class="lead" style="margin-top:8px">You have grown up with these tools and Sam has not. Your value is helping a non-technical owner separate real opportunity from hype.</p>
<small>Sources: Thryv 2026 AI and Small Business Adoption Survey (Jul 2026), Simply Business 2026 Small Business AI Outlook, US Chamber of Commerce small business AI research, and reporting on restaurant owners using AI.</small>
<h3 style="margin:22px 0 4px">Cisco in plain English: what you would actually be talking about</h3>
<p class="lead">You do not need to know the catalog. You do need to understand what each area means for Sam, so your questions are well aimed. Do not pitch products on the call. Describe the idea, and bring a colleague from the technical team for detail.</p>
<div class="c"><h3>The big picture: AI sits on top of a foundation</h3>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
<div class="c" style="margin:0;border-left:4px solid var(--L)"><b>Top: AI tools</b><br><small>Scheduling, forecasting, customer chat, reporting. What Sam is curious about. Cisco does not sell these coffee-shop AI apps.</small></div>
<div class="c" style="margin:0;border-left:4px solid var(--T)"><b>Middle: joined-up systems and clean data</b><br><small>Tills, stock, schedules and sales from all 12 shops feeding one place.</small></div>
<div class="c" style="margin:0;border-left:4px solid var(--ac);background:var(--sf2)"><b>Base: reliable, secure connection and access (Cisco's territory)</b><br><small>Wi-Fi, network, security and logins in every shop. If this is shaky, everything above it disappoints.</small></div></div>
<p class="ans" style="margin-top:8px"><b>Your angle:</b> Sam is excited about the top layer. Your job is to understand the base first, because AI only works well on top of it.</p></div>
${CP.map((c,i)=>`<details ${i?'':'open'}><summary><span><span class="tag">${c[1]}</span>${c[0]}</span></summary><div class="in">
<div class="c" style="border-left:4px solid var(--ac)"><div class="m">In plain English</div><p>${c[2]}</p></div>
<div class="c"><div class="m">What it includes</div><ul>${c[3].map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="c" style="border-left:4px solid var(--A)"><div class="m">What it fixes for Sam</div><p>${c[4]}</p></div>
<div class="w2 ok"><b>Raise it as a question:</b> <span class="ans">${c[5]}</span></div></div></details>`).join('')}
<div class="c"><h3>If Sam asks, "So what does Cisco actually do?"</h3><p class="ans">"We make the technology that keeps businesses connected and protected: the Wi-Fi and network in each shop, the security around it, and one screen to manage all of it. For a chain like yours, that means every shop works the same way, customers get reliable Wi-Fi and your data stays protected. AI tools sit on top of that, so getting the foundation right makes them work better. I'd rather understand your business first before suggesting anything."</p></div>
<h3 style="margin:18px 0 4px">Jargon decoder</h3>
<p class="lead">If you use a technical word, translate it straight away. Sam is a business owner, not a technologist.</p>
${GLOSS.map(g=>`<div class="c" style="padding:10px 14px;margin:6px 0"><b>${g[0]}:</b> <small>${g[1]}</small></div>`).join('')}
<small>Product details are drawn from Cisco Meraki retail and restaurant material and Cisco's small business pages. Check current product names before naming anything to Sam. On the call, describe, do not name-drop.</small>
<h3 style="margin:18px 0 4px">If Sam pushes back</h3>
${OBJ.map(o=>`<details><summary><span>${o[0]}</span></summary><div class="in"><p class="ans">${o[1]}</p></div></details>`).join('')}
<h3 style="margin:18px 0 4px">Good vs weak discovery</h3>
<div class="g"><div class="c"><h3>Do</h3><ul><li>Open questions, what, how, why</li><li>Listen more than you talk</li><li>Follow up on what Sam says</li><li>Dig into why it matters and what it costs</li><li>Say "I don't know" when you do not</li></ul></div>
<div class="c"><h3>Avoid</h3><ul><li>Jumping to products in the first few minutes</li><li>Pitching AI features Sam never asked about</li><li>Asking what basic research would have told you</li><li>Talking so much Sam never opens up</li></ul></div></div>
<div class="c"><h3>What they score</h3><ul><li><b>Learning Agility:</b> how fast you get up to speed on Sam's world.</li><li><b>Earn the Second Meeting:</b> would Sam genuinely want to talk again?</li><li><b>Judgment with AI:</b> how you used AI to prepare, and how you help Sam tell real from hype.</li></ul></div>
<h3 style="margin:18px 0 4px">Prepare with AI (they expect it)</h3>
<div class="c"><p><small>They care about where you applied your own judgment on top of it. Use these, then write what you changed.</small></p>
<p class="ans"><small id="rp1">Act as Sam Rivera, owner of a 12-shop coffee chain that grew from 3 shops in 3 years. You are busy, a little skeptical of vendors, curious but overwhelmed about AI, and not technical. I am a Cisco Associate Sales Rep on a 20-minute first call. Stay in character, answer briefly, reveal problems only if I ask good follow-up questions, and do not volunteer information. After 20 minutes, give me feedback on my listening, my follow-ups, and whether you would take a second meeting.</small></p>
<button class="p" id="rc1">Copy Sam prompt</button>
<p style="margin-top:12px" class="ans"><small id="rp2">List the 10 biggest operational, technology and customer experience challenges a 12-shop coffee chain growing to 20 shops would face, including two near college campuses. Then tell me which of those AI could realistically help and which is hype.</small></p>
<button class="p" id="rc2">Copy research prompt</button></div>
<div class="c"><h3>Say this in the feedback: how I used AI</h3><p class="ans">I used AI to research how a chain like Rivera Coffee runs and to draft discovery questions. <mark class="f">Name 2 questions AI gave you that you cut or rewrote, and why.</mark> <mark class="f">Name 1 thing AI got wrong or missed that you added yourself.</mark></p></div>
<h3 style="margin:18px 0 4px">The 10-minute feedback</h3>
<div class="c"><ul><li>Listen first. Do not defend.</li><li>Ask one clarifying question about what you could do better.</li><li>Say one specific thing you would change next time, then stop. Assessors may also ask this later, so have your answer ready.</li></ul></div>`,
'Cisco':()=>`<h2>Cisco brief</h2><p class="lead">Keep this light. Cisco says no technical read-up is needed, but one sharp fact per answer earns credibility.</p>
<div class="g"><div class="c"><h3>Where Cisco is now</h3><ul><li>FY26 revenue $63.3B, up 12%. Q4 was $17.25B, up 18%.</li><li>Hyperscaler AI infrastructure orders hit $9.3B in FY26, about 4.5x prior year. $7.5B of AI revenue is expected in FY27.</li><li>Cisco Live 2026 theme: AgenticOps and Cisco Cloud Control, with AI Defense for securing agents.</li></ul></div>
<div class="c"><h3>UAE angle</h3><ul><li>Cisco signed on as a preferred technology partner for Stargate UAE (1 GW target, first 200 MW planned for 2026) with G42, OpenAI, Oracle, NVIDIA and SoftBank.</li><li>Say "signed on to provide networking, security and observability", not that it is already built.</li></ul></div></div>
<div class="c"><h3>The program</h3><p>12 months: about 3 months of bootcamp, three rotations with quarterly checkpoints, then an Inside Account Executive role. Alumni mentors and Associate Solutions Engineers support you.</p><div class="w2 ok"><b>Hub:</b> London. Say it confidently. Confirm start dates with your recruiter.</div></div>
<h3 style="margin:18px 0 6px">The three solutions (from Cisco's own pages)</h3>
<p class="lead">Each card starts in plain English, then shows how it applies to Sam's coffee chain. For the Role Play, the Sam context matters most. Anchor on outcomes and budget, not features.</p>
${SOL.map((s,i)=>`<details ${i?'':'open'}><summary><span><span class="tag">${s.tag}</span>${s.n}</span></summary><div class="in"><p><i>${s.one}</i></p>
<div class="c" style="border-left:4px solid var(--ac)"><div class="m">In plain English</div><p>${s.plain}</p></div>
<div class="c"><div class="m">What you actually get</div><ul>${s.get.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="c" style="border-left:4px solid var(--A)"><div class="m">In the context of Sam's coffee chain</div><p>${s.sam}</p></div>
<div class="row A"><div><b>Problem:</b> ${s.p}</div></div><div class="row S"><div><b>Why now:</b> ${s.w}</div></div><div class="row T"><div><b>Why Cisco:</b> ${s.d}</div></div><div class="row R"><div><b>Who cares:</b> ${s.c}</div></div>
<p><b>Product names (so you recognise them):</b> ${s.k}</p><div class="w2 ok"><b>Sample line:</b> <span class="ans">${s.l}</span></div></div></details>`).join('')}</div>
<small>Sources: Cisco Q4 FY26 release and call coverage (Aug 2026), Cisco Stargate UAE release (May 2025), Cisco Live 2026 coverage, Cisco CSAP postings (Jul 2026).</small>`,
'Ask them':()=>`<h2>Questions to ask</h2><p class="lead">Pick two. They are Account Managers, so ask about their real job.</p>`+[
['What did the ASRs who progressed fastest do differently in their first 90 days?','Signals: coachability and drive.'],
['How do Field Sales and Velocity work together on the same customer?','Signals: you understand the sales model.'],
['What is one mistake you made early as an Account Manager, and what did you change?','Signals: it mirrors the Learning beat.'],
['How are AI tools changing your own prospecting and account planning?','Signals: current and curious about AI in sales.']].map(a=>`<div class="c"><h3>${a[0]}</h3><small>${a[1]}</small></div>`).join('')+`<div class="w2"><b>Never ask:</b> anything on the CSAP page, salary before an offer, or whether cold outreach is really required.</div>`,
'Risks':()=>`<h2>Risks and checklist</h2><div class="g">`+[
['No quota experience','Name it first: you sold your own solution to leadership at P&G and that is your closest proof. "I have not carried a quota yet, which is why I want this program."'],
['Saying "we"','Rehearse each story with only "I". Assessors score individual contribution.'],
['Thin Learning beat','Write one specific behavior change per story, not "I learned to communicate".'],
['Flight risk','Interest in strategy and building things is real. Frame quota ownership as a foundation, not a detour.'],
['Year at the hub','Settle your answer before you walk in. Hesitation reads as attrition risk.']].map(r=>`<div class="c"><h3>${r[0]}</h3><small>${r[1]}</small></div>`).join('')+`</div><h3 style="margin:18px 0 4px">Checklist</h3><div id="cl"></div>`
};
const CL=['Filled every yellow block in the 6 stories','Said each story aloud in under 2 minutes','Checked each answer for "I" vs "we"','Wrote a specific Learning line for every story','Ran the AI mock interview at least twice','Can state 3 Cisco facts without notes','Chose 2 questions to ask','Confirmed start dates with recruiter','Prepared a one-line answer to "what would you redo?"','Tested camera, mic and connection (or route and arrival time)'];
const nav=$('#nav'),app=$('#app');
Object.keys(T).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);nav.append(b);const s=document.createElement('section');s.className='s';s.id='s'+i;s.innerHTML=T[k]();app.append(s)});
function show(k){const ks=Object.keys(T);ks.forEach((x,i)=>{$('#s'+i).classList.toggle('on',x===k);nav.children[i].classList.toggle('on',x===k)});window.scrollTo({top:0})}
show('Plan');
document.addEventListener('click',e=>{const a=e.target.closest('.ans');if(a&&document.body.classList.contains('cover'))a.classList.toggle('show')});
$('#cv').onclick=e=>{const c=document.body.classList.toggle('cover');e.target.textContent='Cover mode: '+(c?'on':'off')};
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
let iv;$('#tm').onclick=()=>{clearInterval(iv);let n=120;const u=()=>{$('#tv').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};u();iv=setInterval(()=>{n--;u();if(n<=0){clearInterval(iv);$('#tv').textContent='Time. Land the Learning.'}},1000)};
$('#cp').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText($('#pr').textContent);e.target.textContent='Copied'};

let riv;$('#rtm').onclick=()=>{clearInterval(riv);let n=0;const u=()=>{let ph=PH[0];PH.forEach(p=>{if(n>=p[0])ph=p});$('#rtv').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')+' / 20:00 · '+ph[1]};u();riv=setInterval(()=>{n++;u();if(n>=1200){clearInterval(riv);$('#rtv').textContent='Time. Move to feedback.'}},1000)};
[['rc1','rp1'],['rc2','rp2']].forEach(a=>{$('#'+a[0]).onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText($('#'+a[1]).textContent);e.target.textContent='Copied'}});
let st={};try{st=JSON.parse(localStorage.getItem('csapCl')||'{}')}catch(e){}
$('#cl').innerHTML=CL.map((t,i)=>`<div class="ck ${st[i]?'d':''}" data-i="${i}"><i>${st[i]?'✓':''}</i><span>${t}</span></div>`).join('');
$('#cl').onclick=e=>{const d=e.target.closest('.ck');if(!d)return;const i=d.dataset.i;st[i]=!st[i];d.classList.toggle('d',st[i]);d.firstChild.textContent=st[i]?'✓':'';try{localStorage.setItem('csapCl',JSON.stringify(st))}catch(e){}};
</script>
